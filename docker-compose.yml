# Pokretanje cijelog sistema: docker compose up -d --build
# Sve postavke se citaju iz .env (jedno mjesto). Adrese servisa unutar Docker mreze
# (db, rabbitmq, mailpit) postavljene su ispod u "environment" i imaju prednost nad .env.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    container_name: ebiblioteka-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ebiblioteka-db-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: ebiblioteka-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ebiblioteka-rabbitmq-data:/var/lib/rabbitmq

  # Lazni SMTP server: prima e-mailove koje salje Worker i prikazuje ih na http://localhost:${SMTP_WEB_PORT}
  mailpit:
    image: axllent/mailpit:v1.20.5
    container_name: ebiblioteka-mailpit
    ports:
      - "${SMTP_PORT}:1025"
      - "${SMTP_WEB_PORT}:8025"

  api:
    build:
      context: ./src
      dockerfile: eBiblioteka.Api/Dockerfile
    image: ebiblioteka-api:1.0.0
    container_name: ebiblioteka-api
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./src
      dockerfile: eBiblioteka.Worker/Dockerfile
    image: ebiblioteka-worker:1.0.0
    container_name: ebiblioteka-worker
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  ebiblioteka-db-data:
  ebiblioteka-rabbitmq-data:
